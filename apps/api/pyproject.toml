[project]
name = "learnai-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3", "alembic>=1.14,<2"
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
